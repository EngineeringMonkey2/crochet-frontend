<head>

    <title>Shopping Cart</title>
    <!-- Stripe.js library -->
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica', 'Arial', sans-serif;
            color: #333333;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 193, 7, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(220, 53, 69, 0.06) 0%, transparent 50%);
            position: relative;
            overflow-x: hidden;
        }
        
        /* Subtle texture overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.02) 2px,
                    rgba(255, 255, 255, 0.02) 4px
                );
            pointer-events: none;
            z-index: 1;
        }

        /* Toolbar container - Copied from your other pages for consistency */
        .toolbarcontain {
            background-color: rgba(220, 225, 230, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(200, 210, 220, 0.4);
        }

        .toolbar a {
            color: #333333;
            text-align: center;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        
        .toolbar .cart-link {
            position: relative;
        }
        
        #cart-count {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: red;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            display: none; /* Hidden by default, shown by JS */
        }

        .hovertext a:hover {
            color: #6c757d;
            transform: scale(1.3);
        }

        .hoverbackground a:hover {
            transform: scale(1.1);
        }

        .leftali, .rightali {
            display: flex;
            align-items: center;
        }

        /* Main cart section */
        .cart-section {
            padding: 120px 20px 80px;
            width: 100%;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .cart-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .cart-container h1 {
            font-size: 36px;
            font-weight: bold;
			margin-top: -25px;
            margin-bottom: 30px;
            text-align: center;
            color: #3e2723;
        }
        
        /* Individual item styling */
        .cart-item {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            padding: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        /* Container for the full custom monkey image */
        .custom-monkey-image-container {
            position: relative;
            width: 100px; /* Fixed width for the thumbnail */
            height: 100px; /* Fixed height for the thumbnail */
            margin-right: 20px;
            overflow: hidden; /* Hide parts that go outside the container */
        }
        
        /* Common style for all image parts of the character, scaled and positioned */
        .custom-monkey-image-container .character-part {
            position: absolute;
            outline: none;
            width: 200px; /* Base size for rendering head and face */
            height: 300px; /* Base size for rendering head and face */
            transform-origin: top left;
        }
        
        /* CSS for the eyes and mouth of the custom monkey */
        .custom-monkey-image-container .eye {
            position: absolute;
            width: 16px; /* Scaled down */
            height: 12px; /* Scaled down */
            background: white;
            border-top: 5px solid white; /* Scaled down */
            border-radius: 16.66px; /* Scaled down */
            z-index: 101;
        }
        .custom-monkey-image-container #left-eye { top: 50px; left: 60px; } /* Scaled down positions */
        .custom-monkey-image-container #right-eye { top: 50px; left: 20px; } /* Scaled down positions */

        .custom-monkey-image-container .pupil {
            position: absolute;
            width: 15px; /* Scaled down */
            height: 15px; /* Scaled down */
            background: black;
            border-radius: 50%;
            left: 10%;
            top: -20%;

        }
        .custom-monkey-image-container .pupilwhite {
            position: absolute;
            width: 3px; /* Scaled down */
            height: 3px; /* Scaled down */
            background: white;
            border-radius: 50%;
            left: 45%;
            top: 20%;

        }
        .custom-monkey-image-container #mouth {
            position: absolute;
            z-index: 100;
            width: 25px; /* Scaled down */
            height: 8px; /* Scaled down */
            background: black;
            border: 1.66px solid #000; /* Scaled down */
            border-radius: 0 0 40px 40px / 0 0 30px 30px; /* Scaled down */
            top: 82px; left: 35px; /* Scaled down positions */
        }
        
        /* Positioning rules for the head and ears to fit the thumbnail */
        .custom-monkey-image-container .head-part { top: 7px; left: 7.5px; width: 82%; height: auto; z-index: 99; }
        .custom-monkey-image-container .left-ear-part { top: 16px; left: 7.5px; width: 27px; height: auto; transform: rotate(25deg); z-index: 98; }
        .custom-monkey-image-container .right-ear-part { top: 26px; left: 69px; width: 27px; height: auto; transform: rotate(-18deg); z-index: 98; }


        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 20px;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-details h3 {
            font-size: 20px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        
        .item-details .price {
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            margin: 10px 0;
        }
        
        .quantity-controls button {
            background-color: #e0e0e0;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .quantity-controls button:hover {
            background-color: #bdbdbd;
        }

        .quantity-controls span {
            padding: 0 15px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .item-total {
            font-size: 20px;
            font-weight: bold;
            margin-left: auto;
            padding-left: 20px;
        }

        .remove-item {
            color: #e53e3e;
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 5px;
        }
        .remove-item:hover {
            color: #c53030;
        }
        
        /* Summary Box */
        .cart-summary {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            margin-top: 40px;
        }
        
        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .summary-line.total {
            font-size: 24px;
            font-weight: bold;
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
            margin-top: 10px;
        }
        
        .checkout-button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        
        .checkout-button:hover {
            background-color: #218838;
        }
        
        .checkout-button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
		
		
        .footer-section {
		  background-color: #ffffff;
		  color: #333;
		  padding: 40px 20px;
		  text-align: center;
		}

		.footer-container {
		  max-width: 1200px;
		  margin: 0 auto;
		  display: flex;
		  justify-content: center;
		  gap: 30px;
		  flex-wrap: wrap;
		}

		.footer-container a {
		  color: #333;
		  text-decoration: none;
		  font-size: 16px;
		  transition: color 0.3s ease;
		}

		.footer-container a:hover {
		  color: #000000;
		  text-decoration: underline;
		}
		
        /* Empty Cart Message */
        #empty-cart-message {
            text-align: center;
            padding: 80px 20px;
        }
        #empty-cart-message h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        #empty-cart-message a {
            display: inline-block;
            padding: 12px 25px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        #empty-cart-message a:hover {
            background-color: #333333;
        }




		@media (max-width: 640px) {
			.cart-item {
				flex-direction: column;
				align-items: center; /* This will center the entire item block */
				text-align: center; /* This will center the text inside the item block */
			}

			.custom-monkey-image-container,
			.cart-item img {
				margin-right: 0;
				margin-bottom: 15px; /* Add some space below the image */
			}
			
			.item-details {
				flex-grow: 1;
				width: 100%; /* Ensure it takes full width for centering */
				margin-bottom: 15px;
			}

			.item-details h3,
			.item-details .price,
			.quantity-controls,
			.remove-item {
				margin-right: 0;
				margin-left: 0;
				justify-content: center; /* Center the quantity controls */
			}

			.item-total {
				margin-left: -20px;
				margin-top: 15px;
				width: 100%; /* Ensure it takes full width for centering */
			}
			
				
		  .toolbar a {
			font-size: 15px;
			padding: 10px 5px;
			
		  }
			
			
			
			
		}
		
		
		
		
		
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const itemsContainer = document.getElementById('cart-items-container');
            const summaryContainer = document.getElementById('cart-summary-container');
            const emptyMessage = document.getElementById('empty-cart-message');

            /**
             * Calculates the shipping fee based on the subtotal.
             * @param {number} subtotal - The total cost of items in the cart.
             * @returns {number} The shipping fee.
             */
            function calculateShipping(subtotal) {
                if (subtotal <= 0) {
                    return 0;
                } else if (subtotal <= 25) {
                    return 3.50;
                } else if (subtotal > 25 && subtotal <= 50) {
                    return 7.50;
                } else if (subtotal > 50 && subtotal <= 100) {
                    return 11.50;
                } else { // subtotal > 100
                    return 0;
                }
            }

            function renderCart() {
                const cart = getCart();
                itemsContainer.innerHTML = ''; // Clear current view
                summaryContainer.innerHTML = '';

                if (cart.length === 0) {
                    emptyMessage.style.display = 'block';
                    itemsContainer.style.display = 'none';
                    summaryContainer.style.display = 'none';
                    return;
                }
                
                emptyMessage.style.display = 'none';
                itemsContainer.style.display = 'block';
                summaryContainer.style.display = 'block';

                let subtotal = 0;

                cart.forEach((item, index) => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    
                    let imageHtml;
                    if (item.images) {
                        // This is a custom monkey. Render all parts in a single container.
                        imageHtml = `
                            <div class="custom-monkey-image-container">
                                <img id="head" class="character-part head-part" src="${item.images.head}" alt="Character Head">
                                <img id="left-ear" class="character-part left-ear-part" src="${item.images['left-ear']}" alt="Left Ear">
                                <img id="right-ear" class="character-part right-ear-part" src="${item.images['right-ear']}" alt="Right Ear">
                                <!-- Add the face and eyes -->
                                <div id="left-eye" class="eye"><div class="pupil"><div class="pupilwhite"></div></div></div>
                                <div id="right-eye" class="eye"><div class="pupil"><div class="pupilwhite"></div></div></div>
                                <div id="mouth"></div>
                            </div>
                        `;
                    } else {
                        // This is a regular product. Render a single image.
                        const imgSrc = item.image || 'https://placehold.co/100x100/f2e5d9/333?text=Item';
                        imageHtml = `<img src="${imgSrc}" alt="${item.name}">`;
                    }
                    

                    const itemPrice = parseFloat(item.price.replace('$', ''));
                    const totalItemPrice = (itemPrice * item.quantity).toFixed(2);
                    subtotal += parseFloat(totalItemPrice);

                    itemElement.innerHTML = `
                        ${imageHtml}
                        <div class="item-details">
                            <h3>${item.name}</h3>
                            <p class="price">${item.price}</p>
                            <div class="quantity-controls">
                                <button onclick="changeItemQuantity(${index}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="changeItemQuantity(${index}, 1)">+</button>
                            </div>
                            <button class="remove-item" onclick="removeItemFromCart(${index})">Remove</button>
                        </div>
                        <div class="item-total">
                            $${totalItemPrice}
                        </div>
                    `;
                    itemsContainer.appendChild(itemElement);
                });

                // Render Summary with Shipping
                const shippingFee = calculateShipping(subtotal);
                const estimatedTax = subtotal * 0.08; // This is a client-side estimate
                const estimatedTotal = subtotal + shippingFee + estimatedTax;

                summaryContainer.innerHTML = `
                    <div class="cart-summary">
                        <div class="summary-line">
                            <span>Subtotal</span>
                            <span>$${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="summary-line">
                            <span>Shipping</span>
                            <span>$${shippingFee.toFixed(2)}</span>
                        </div>
                        <div class="summary-line">
                            <span>Estimated Tax</span>
                            <span>$${estimatedTax.toFixed(2)}</span>
                        </div>
                        <div class="summary-line total">
                            <span>Estimated Total</span>
                            <span>$${estimatedTotal.toFixed(2)}</span>
                        </div>
                        <button class="checkout-button">Proceed to Checkout</button>
                    </div>
                `;
                
                // Add event listener to the newly created checkout button
                const checkoutButton = document.querySelector('.checkout-button');
                checkoutButton.addEventListener('click', handleCheckout);
            }

            // --- STRIPE CHECKOUT HANDLER ---
            async function handleCheckout() {
                const checkoutButton = document.querySelector('.checkout-button');
                checkoutButton.disabled = true;
                checkoutButton.textContent = 'Processing...';

                const cart = getCart();
                // We must calculate the subtotal and shipping fee again to ensure it's accurate before sending to the backend
                const subtotal = cart.reduce((sum, item) => {
                    const price = parseFloat(item.price.replace('$', ''));
                    return sum + (price * item.quantity);
                }, 0);
                const shippingFee = calculateShipping(subtotal);
                
                try {
					const response = await fetch('https://crochet-backend-ho1l.onrender.com/create-checkout-session', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ cart, shippingFee }) // Pass shipping fee to backend
					});

                    if (!response.ok) {
                        throw new Error('Server responded with an error.');
                    }

                    const session = await response.json();
                    
                    // Redirect to Stripe's checkout page
                    window.location.href = session.url;

                } catch (error) {
                    console.error('Checkout error:', error);
                    checkoutButton.disabled = false;
                    checkoutButton.textContent = 'Proceed to Checkout';
                    // You could show an error message to the user here
                }
            }
            
            window.removeItemFromCart = (index) => {
                removeFromCart(index);
                renderCart();
                updateCartIcon(); // Also update the icon in the toolbar
            };

            window.changeItemQuantity = (index, delta) => {
                updateQuantity(index, delta);
                renderCart();
                updateCartIcon();
            };
            
            renderCart();
        });
    </script>
