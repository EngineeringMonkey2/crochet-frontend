<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica', 'Arial', sans-serif;
            color: #333333;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 193, 7, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(220, 53, 69, 0.06) 0%, transparent 50%);
            position: relative;
            overflow-x: hidden;
            -webkit-print-color-adjust: exact; /* Ensures background prints in Chrome */
            print-color-adjust: exact;
        }
        
        /* Subtle texture overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.02) 2px,
                    rgba(255, 255, 255, 0.02) 4px
                );
            pointer-events: none;
            z-index: 1;
        }

        /* Toolbar container */
        .toolbarcontain {
            background-color: rgba(220, 225, 230, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            box-sizing: border-box;
        }

        .toolbar a {
            color: #333333;
            text-align: center;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            transition: transform 0.3s ease, color 0.3s ease;
        }
        
        .toolbar .cart-link {
            position: relative;
        }
        
        #cart-count {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: red;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            display: none;
        }

        .hovertext a:hover { color: #cccccc; transform: scale(1.1); }
        .hoverbackground a:hover { transform: scale(1.1); }
        .leftali, .rightali { display: flex; align-items: center; }

        /* Main Receipt Section */
        .receipt-section {
            padding: 120px 20px 80px;
            width: 100%;
            box-sizing: border-box;
            min-height: 100vh;
        }

        /* New Action Buttons Container */
        .action-container {
            max-width: 800px;
            margin: 0 auto 20px auto;
            text-align: right;
        }

        #download-pdf-btn {
            background-color: #3e2723;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #download-pdf-btn:hover {
            background-color: #5d4037;
        }
        
        #download-pdf-btn:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }

        .receipt-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 40px;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        /* Explicitly center header elements to fix PDF rendering */
        .receipt-header h1, .receipt-header p {
            text-align: center;
        }

        .receipt-header h1 {
            font-size: 32px;
            color: #28a745;
            margin: 0 0 10px 0;
        }

        .receipt-header p {
            font-size: 16px;
            color: #555;
            margin: 0;
        }
        
        .receipt-header .order-number {
            font-size: 14px;
            color: #777;
            margin-top: 15px;
        }

        .order-details, .shipping-details, .tracking-details {
            margin-bottom: 30px;
        }

        .order-details h2, .shipping-details h2, .tracking-details h2 {
            font-size: 22px;
            color: #3e2723;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        #order-items-container .item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        #order-items-container .item:last-child {
            border-bottom: none;
        }

        #order-items-container .item-name {
            font-weight: bold;
        }
        
        #order-items-container .item-details {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        
        #order-items-container .item-details ul {
            padding-left: 20px;
            margin: 5px 0 0 0;
        }

        .order-summary {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }
        
        .summary-line {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .summary-line.total {
            font-size: 20px;
            font-weight: bold;
            color: #3e2723;
        }

        #shipping-address, #tracking-info {
            line-height: 1.6;
            font-size: 16px;
            color: #333;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 50px;
            font-size: 20px;
            color: #555;
        }
		
		
		
			
			
		/* --- START: Footer Section Styles --- */
		.footer-section {
		  background-color: #ffffff;
		  color: #333;
		  padding: 40px 20px;
		  text-align: center;
		}

		.footer-container {
		  max-width: 1200px;
		  margin: 0 auto;
		  display: flex;
		  justify-content: center;
		  gap: 30px;
		  flex-wrap: wrap;
		}

		.footer-container a {
		  color: #333;
		  text-decoration: none;
		  font-size: 16px;
		  transition: color 0.3s ease;
		}

		.footer-container a:hover {
		  color: #000000;
		  text-decoration: underline;
		}
		/* --- END: Footer Section Styles --- */		
		
		
		
		
		
		
		
		
		
		
		
        
        /* Hide toolbar and download button when printing */
        @media print {
          .toolbarcontain, .action-container {
            display: none;
          }
          .receipt-section {
            padding: 20px 0;
          }
          .receipt-container {
            box-shadow: none;
            border: 1px solid #ccc;
          }
		  
        }
		
		
		
		
        
        @media (max-width: 768px) {

			
			  
			  .toolbar a {
				font-size: 15px;
				padding: 10px 5px;
			  }		
		
		}
		
		
		
		
		
		
		

    </style>
	<link rel="icon" type="image/png" href="images/tabphoto-min.png">

</head>

    <script src="cart.js"></script>
    <script>
        // The URL of your backend hosted on Render
        const backendUrl = 'https://crochet-backend-ho1l.onrender.com';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            const receiptContainer = document.getElementById('receipt-container');
            const actionContainer = document.getElementById('action-container');
            const downloadBtn = document.getElementById('download-pdf-btn');
            
            let orderData = null; // To store order data for the PDF function

            if (sessionId) {
                // A session ID exists, so the purchase was likely successful.
                // Clear the cart from the previous session.
                if (typeof window.clearCart === 'function') {
                    window.clearCart();
                    window.updateCartIcon();
                }
                
                try {
                    // Fetch order details from our server endpoint, using the full backend URL
                    const response = await fetch(`${backendUrl}/order-details?session_id=${sessionId}`);
                    if (!response.ok) {
                        // If the server responded with an error, show it.
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to fetch order details.');
                    }
                    const order = await response.json();
                    orderData = order; // Save order data

                    // --- Render the receipt ---
                    
                    // Format shipping address
                    const shippingDetails = order.shipping_details;
                    const shippingHtml = shippingDetails ? `
                        ${shippingDetails.name}<br>
                        ${shippingDetails.address.line1}${shippingDetails.address.line2 ? '<br>' + shippingDetails.address.line2 : ''}<br>
                        ${shippingDetails.address.city}, ${shippingDetails.address.state} ${shippingDetails.address.postal_code}<br>
                        ${shippingDetails.address.country}
                    ` : 'N/A';
                    
                    // Format order items
                    let itemsHtml = order.line_items.map(item => {
                        // Stripe amounts are in cents, so divide by 100 for dollars.
                        const itemPrice = (item.amount_total / 100).toFixed(2);

                        return `
                            <div class="item">
                                <div>
                                    <div class="item-name">${item.quantity} x ${item.description}</div>
                                </div>
                                <div class="item-price">$${itemPrice}</div>
                            </div>
                        `;
                    }).join('');

                    // Correctly calculate and format currency values from cents to dollars
                    const subtotal = (order.amount_subtotal / 100).toFixed(2);
                    const shipping = ((order.shipping_cost ? order.shipping_cost.amount_total : 0) / 100).toFixed(2);
                    const taxes = ((order.total_details ? order.total_details.amount_tax : 0) / 100).toFixed(2);
                    const total = (order.amount_total / 100).toFixed(2);

                    // Populate the container with all the order information
                    receiptContainer.innerHTML = `
                        <div class="receipt-header">
                            <h1>Thank You for Your Order!</h1>
                            <p>A confirmation email has been sent to you.</p>
                            <p class="order-number"><strong>Order Number:</strong> #${order.id.slice(-8)}</p>
                        </div>

                        <div class="order-details">
                            <h2>Order Summary</h2>
                            <div id="order-items-container">${itemsHtml}</div>
                            <div class="order-summary">
                                <div class="summary-line">
                                    <span>Subtotal</span>
                                    <span>$${subtotal}</span>
                                </div>
                                <div class="summary-line">
                                    <span>Shipping</span>
                                    <span>$${shipping}</span>
                                </div>
                                <div class="summary-line">
                                    <span>Taxes</span>
                                    <span>$${taxes}</span>
                                </div>
                                <div class="summary-line total">
                                    <span>Total</span>
                                    <span>$${total}</span>
                                </div>
                            </div>
                        </div>

                        <div class="shipping-details">
                            <h2>Shipping Address</h2>
                            <div id="shipping-address">${shippingHtml}</div>
                        </div>

                        <div class="tracking-details">
                            <h2>Tracking Information</h2>
                            <p id="tracking-info">Your order is being prepared for shipment. A tracking number will be sent to your email once it's available.</p>
                        </div>
                    `;
                    
                    // Show the download button now that data is loaded
                    actionContainer.style.display = 'block';

                } catch (error) {
                    receiptContainer.innerHTML = `<div class="receipt-header"><h1>Error</h1><p>Sorry, we could not retrieve your order details. Please check your email for the confirmation.</p></div>`;
                    console.error('Error fetching receipt data:', error);
                }
            } else {
                receiptContainer.innerHTML = `<div class="receipt-header"><h1>Invalid Page</h1><p>No order session found. <a href="ShopPage.html">Continue shopping</a>.</p></div>`;
            }

            // --- PDF Download Logic ---
            downloadBtn.addEventListener('click', () => {
                if (!orderData) {
                    // This is an alert, which should be replaced by a custom modal UI.
                    alert("Order data is not loaded yet.");
                    return;
                }
                
                downloadBtn.disabled = true;
                downloadBtn.textContent = 'Generating...';

                const receiptElement = document.getElementById('receipt-container');
                const { jsPDF } = window.jspdf;

                // Use html2canvas to capture the receipt container
                html2canvas(receiptElement, { 
                    scale: 2, // Higher scale for better resolution
                    useCORS: true 
                }).then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    
                    // Use A4 paper size (210mm wide) and portrait orientation
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: 'a4'
                    });

                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                    
                    // Add the image to the PDF, scaling it to fit the page width
                    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                    pdf.save(`order-receipt-${orderData.id.slice(-8)}.pdf`);
                    
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = 'Download as PDF';
                }).catch(err => {
                    console.error("Error generating PDF:", err);
                    // This is an alert, which should be replaced by a custom modal UI.
                    alert("Sorry, there was an error creating the PDF.");
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = 'Download as PDF';
                });
            });
        });
    </script>
