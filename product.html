<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Product Details</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* General Body and Toolbar Styles (from your original file) */
    body {
      margin: 0;
      font-family: 'Helvetica', 'Arial', sans-serif;
      color: #333333;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      background-image: 
          radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 193, 7, 0.08) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(220, 53, 69, 0.06) 0%, transparent 50%);
      position: relative;
      overflow-x: hidden;
    }
    
    /* Subtle texture overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
          repeating-linear-gradient(
              45deg,
              transparent,
              transparent 2px,
              rgba(255, 255, 255, 0.02) 2px,
              rgba(255, 255, 255, 0.02) 4px
          );
      pointer-events: none;
      z-index: 1;
    }

    .toolbarcontain {
      background-color: rgba(220, 225, 230, 0.95);
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 20px;
      box-sizing: border-box;
      border-bottom: 1px solid rgba(200, 210, 220, 0.4);
    }

    .toolbar a {
      color: #333333;
      text-align: center;
      padding: 15px 20px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      transition: transform 0.3s ease, color 0.3s ease;
    }
    
    .toolbar .cart-link {
        position: relative;
    }
    
    #cart-count {
        position: absolute;
        top: 8px;
        right: 8px;
        background-color: red;
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        display: none; /* Hidden by default */
    }

    .hovertext a:hover {
      color: #6c757d;
      transform: scale(1.3);
    }

    .hoverbackground a:hover {
      transform: scale(1.1);
    }

    .leftali, .rightali {
      display: flex;
      align-items: center;
    }

    /* Main Product Section */
    .product-detail {
	  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      padding: 120px 20px 80px;
      width: 100%;
      box-sizing: border-box;
      min-height: 100vh;
    }

    .product-container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      gap: 40px;
      align-items: flex-start; /* Aligns items to the top */
    }

    /* --- NEW: Image Gallery Layout --- */
    .product-gallery {
        display: flex;
        gap: 20px;
        flex: 1.5; /* Give gallery more space */
        min-width: 0; /* Prevents flexbox overflow issues */
    }

    .thumbnail-gallery {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .thumbnail-item {
        width: 80px;
        height: 80px;
        object-fit: cover;
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 8px;
        transition: border-color 0.3s ease;
    }

    .thumbnail-item:hover {
        border-color: #795548; /* A brown color from your theme */
    }

    .thumbnail-item.active {
        border-color: #3e2723; /* A darker brown for active */
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }
    
    .main-image-container {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #product-image {
        width: 100%;
        max-height: 640px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 15px; /* Space between image and arrows */
    }

    .gallery-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }
    
    /* --- UPDATED: Arrow Styles --- */
    .arrow {
        /* Removed absolute positioning */
        position: static;
        transform: none;
        background-color: rgba(255, 255, 255, 0.8);
        color: #333;
        border: 1px solid #ddd;
        padding: 10px 15px;
        cursor: pointer;
        font-size: 20px;
        border-radius: 50%;
        transition: background-color 0.3s ease, box-shadow 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .arrow:hover {
        background-color: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    
    /* Product Info Section */
    .product-info {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .product-info h1 {
      font-size: 28px;
      font-weight: bold;
      margin: 0;
      text-transform: none;
      color: #3e2723;
    }

    .product-info .price {
      font-size: 22px;
      font-weight: bold;
      color: #000000;
    }

    .product-info .description {
      font-size: 16px;
      color: #333333;
      line-height: 1.6;
    }


    .product-info .dimensions {
      font-size: 16px;
      color: #333333;
      line-height: 1;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-selector label {
      font-size: 16px;
      font-weight: 500;
      color: #333333;
    }

    .quantity-selector input {
      width: 60px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 5px;
      text-align: center;
    }
    
    .action-buttons {
        display: flex;
        gap: 15px;
        margin-top: 10px;
        flex-wrap: wrap;
    }

    .action-button {
      padding: 15px 20px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      text-transform: uppercase;
      flex-grow: 1;
    }
    
    .action-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .add-to-cart {
      background-color: #5d4037;
      color: #ffffff;
    }

    .add-to-cart:hover {
      background-color: #4e342e;
    }
    
    .buy-now {
        background-color: #2563EB;
        color: white;
    }
    .buy-now:hover {
        background-color: #1D4ED8;
    }
    
    /* --- START: Footer Section Styles --- */
    .footer-section {
      background-color: #ffffff;
      color: #333;
      padding: 40px 20px;
      text-align: center;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .footer-container a {
      color: #333;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .footer-container a:hover {
      color: #000000;
      text-decoration: underline;
    }
    /* --- END: Footer Section Styles --- */


    
    /* Responsive design */
    @media (max-width: 768px) {
      .front h1 {
        font-size: 42px;
      }

      .toolbar a {
        font-size: 15px;
        padding: 10px 5px;
		
      }

    /* Responsive Design */
    @media (max-width: 900px) {
      .product-container {
        flex-direction: column;
        align-items: center;
      }
      .product-gallery {
        flex-direction: column-reverse; /* Puts main image on top on mobile */
      }
      .thumbnail-gallery {
        flex-direction: row;
        justify-content: center;
        flex-wrap: wrap;
      }
	 
    }
  </style>

  <!-- Main Content -->

  <!-- Your Scripts -->
  <!-- Load the shared config file FIRST -->
  <script src="config.js"></script>

  <script src="cart.js"></script>
  <script src="product-reviews.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- Element References ---
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get('productId'));
      const product = products.find(p => p.id === productId);

      const productImageEl = document.getElementById('product-image');
      const productTitleEl = document.getElementById('product-title');
      const productPriceEl = document.getElementById('product-price');
      const productDescriptionEl = document.getElementById('product-description');
      const productDimensionsEl = document.getElementById('product-dimensions');
      const thumbnailGallery = document.getElementById('thumbnail-gallery');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      
      let currentImageIndex = 0;
      let productImages = [];

      if (product) {
        // --- Populate Product Info ---
        productTitleEl.textContent = product.name;
        productPriceEl.textContent = product.price;
        productDescriptionEl.textContent = product.description;
        productDimensionsEl.textContent = product.dimensions;
        productImageEl.alt = product.name;

        if (product.images && Array.isArray(product.images) && product.images.length > 0) {
            productImages = product.images;
        } else if (product.image) {
            productImages = [product.image];
        }

        if (productImages.length > 1) {
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
            thumbnailGallery.innerHTML = '';
            productImages.forEach((imgSrc, index) => {
                const thumb = document.createElement('img');
                thumb.src = imgSrc;
                thumb.alt = `${product.name} thumbnail ${index + 1}`;
                thumb.className = 'thumbnail-item';
                thumb.dataset.index = index;
                thumb.loading = 'lazy'; // Add lazy loading to thumbnails

                thumb.addEventListener('click', () => setActiveImage(index));
                thumbnailGallery.appendChild(thumb);
            });
            nextBtn.addEventListener('click', () => {
                const newIndex = (currentImageIndex + 1) % productImages.length;
                setActiveImage(newIndex);
            });
            prevBtn.addEventListener('click', () => {
                const newIndex = (currentImageIndex - 1 + productImages.length) % productImages.length;
                setActiveImage(newIndex);
            });
        }
        
        if (productImages.length > 0) {
             setActiveImage(0);
        }

        function setActiveImage(index) {
            productImageEl.src = productImages[index];
            currentImageIndex = index;
            const thumbnails = document.querySelectorAll('.thumbnail-item');
            thumbnails.forEach(thumb => {
                thumb.classList.remove('active');
                if (parseInt(thumb.dataset.index) === index) {
                    thumb.classList.add('active');
                }
            });
        }

        const addToCartBtn = document.querySelector('.add-to-cart');
        addToCartBtn.addEventListener('click', () => {
            const quantity = parseInt(document.getElementById('quantity').value);
            const item = {
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image || (product.images && product.images[0]),
                quantity: quantity
            };
            addToCart(item);
        });
        
        const buyNowBtn = document.querySelector('.buy-now');
        buyNowBtn.addEventListener('click', () => {
            const quantity = parseInt(document.getElementById('quantity').value);
            const item = {
                id: product.id,
                name: product.name,
                price: product.price,
                image: product.image || (product.images && product.images[0]),
                quantity: quantity
            };
            addToCart(item); 
            window.location.href = 'cart.html';
        });

      } else {
        document.querySelector('.product-container').innerHTML = '<h1>Product not found.</h1><p>Sorry, the product you are looking for does not exist. <a href="ShopPage.html">Return to Shop</a></p>';
      }
    });
  </script>
