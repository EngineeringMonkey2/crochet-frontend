  <style>
    body {
      margin: 0;
      font-family: 'Helvetica', 'Arial', sans-serif;
      color: #333333;
      background: white;
      position: relative;
      overflow-x: hidden;
    }

    /* Toolbar container */
    .toolbarcontain {
      background-color: rgba(220, 225, 230, 0.95);
      backdrop-filter: blur(10px);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 20px;
      box-sizing: border-box;
      transition: top 0.3s ease;
      border-bottom: 1px solid rgba(200, 210, 220, 0.4);
    }
    
    .toolbar .cart-link {
        position: relative;
    }
    
    #cart-count {
        position: absolute;
        top: 8px;
        right: 8px;
        background-color: red;
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        display: none;
    }

    /* New class to hide the toolbar when scrolling down */
    .toolbar-hidden {
        top: -100px;
    }

    /* Toolbar links */
    .toolbar a {
      color: #333333;
      text-align: center;
      padding: 15px 20px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 600;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .hovertext a:hover {
      color: #6c757d;
      transform: scale(1.3);
    }

    .hoverbackground a:hover {
      transform: scale(1.1);
    }

    .leftali, .rightali {
      display: flex;
      align-items: center;
    }

    /* Front section */
    .front {
      height: 100vh;
      width: 100%;
      background-image: url('images/shoppaage-minfall.png');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Padding1 */
    .shoppadding {
      padding-top: 70px;
      position: relative;
      z-index: 1;
    }

    .front h1 {
      font-size: 48px;
      font-weight: bold;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* This container acts as the "canvas" for our character. */
    #character-container {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 600px;
        height: 900px;
        cursor: pointer;
        user-select: none;
    }

    /* Common style for all image parts of the character. */
    .character-part {
        position: absolute;
        transition: transform 0.5s ease-in-out;
        outline: none;
    }

    /* --- POSITIONING RULES --- */
    #head {
        top: -40px;
        left: 50px;
        z-index: 10;
    }

    #left-ear {
        top: 100px;
        left: -70px;
        transform: rotate(18deg);
        z-index: 5;
    }

    #right-ear {
        top: 100px;
        left: 515px;
        transform: rotate(-18deg);
        z-index: 5;
    }
    
    /* Animate ears on hover for more life */
    #character-container:hover #left-ear {
        transform: rotate(10deg) translateY(-10px);
    }
    #character-container:hover #right-ear {
        transform: rotate(-10deg) translateY(-10px);
    }

    #body {
        top: 520px;
        left: 150px;
        z-index: 9;
    }

    #left-arm {
        top: 500px;
        left: -145px;
        z-index: 8;
    }

    #right-arm {
        top: 500px;
        left: 442px;
        z-index: 8;
    }

    #legs {
        top: 800px;
        left: 115px;
        z-index: 8;
    }
    
    #tail {
        top: 750px;
        left: 440px;
        z-index: 6;
    }

    /* --- Eye Styles --- */
    .eye {
        position: absolute;
        width: 100px;
        height: 80px;
        background: #ffffff;
        border-top: 30px solid #ffffff; 
        border-radius: 50px 50px 50px 50px;
        z-index: 16;
        animation: blink 5s infinite;
        forced-color-adjust: none;
    }

    #left-eye {
        top: 220px;
        left: 150px;
    }

    #right-eye {
        top: 220px;
        left: 380px;
    }

    .pupil {
        position: absolute;
        width: 90px;
        height: 90px;
        background: black;
        border-radius: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: look-around 7s ease-in-out infinite;
    }
	
    .pupilwhiteleft {
        position: absolute;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        left: 30%;
        top: -30%;
        transform: translate(-50%, -50%);
        animation: look-around 7s ease-in-out infinite;
    }
			
    .pupilwhiteright {
        position: absolute;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        left: 30%;
        top: -30%;
        transform: translate(-50%, -50%);
        animation: look-around 7s ease-in-out infinite;
    }
    
    @keyframes look-around {
        0% { transform: translate(-50%, -50%) translateX(-20px) translateY(10px); }
        15%, 35% { transform: translate(-50%, -50%) translateX(-20px) translateY(10px); }
        40% { transform: translate(-50%, -50%) translateX(10px) translateY(15px); }
        50%, 70% { transform: translate(-50%, -50%) translateX(10px) translateY(15px); }
        75% { transform: translate(-50%, -50%) translateX(-10px) translateY(13px); }
        80%, 100% { transform: translate(-50%, -50%) translateX(-10px) translateY(13px); }
    }

    @keyframes blink {
        0%, 10%, 15%, 100% { transform: scaleY(1); }
        12% { transform: scaleY(0.1); }
    }

    /* --- MOUTH STYLES --- */
    #mouth {
        position: absolute;
        z-index: 15;
        width: 110px;
        height: 40px;
        border: 12px solid black;
        border-color: transparent transparent black transparent;
        border-radius: 0 0 120px 120px / 0 0 60px 60px;
        top: 400px;
        left: 52%;
        transform: translateX(-50%);
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    #tongue {
        position: absolute;
        width: 50px;
        height: 35px;
        background: #ff8a8a;
        border: 4px solid #000;
        border-radius: 50% 50% 20px 20px;
        bottom: 8px;
        left: 52%;
        transform: translateX(-50%) scaleY(0);
        transform-origin: bottom;
        transition: transform 0.2s ease-in-out 0.1s;
    }

    /* Hover state (Happy smile) */
    #character-container:hover #mouth {
        width: 140px;
        height: 60px;
        background: black;
        border: 5px solid #000;
        border-radius: 0 0 120px 120px / 0 0 90px 90px;
        top: 400px;
        left: 52%;
        transition: transform 0.4s ease-in-out 0.3s;
    }

    #character-container:hover #tongue {
        transform: translateX(-50%) scaleY(1);
    }

    /* --- Arrow Button Styles --- */
    .arrow-btn {
        position: absolute;
        z-index: 20;
        width: 50px;
        height: 50px;

        transform: scale(1.1);
    }
    
    .arrow-btn:active {

    }

    #next-head {

  <script>
    // Wait for the document to be fully loaded before running the script
    document.addEventListener('DOMContentLoaded', () => {
        
        const characterContainer = document.getElementById('character-container');
        characterContainer.style.transition = 'transform 0.3s ease'; 
        let baseScale = 1;

        function getDynamicMultiplier(currentSize, minSize, maxSize, maxMultiplier, minMultiplier) {
            if (currentSize <= minSize) return maxMultiplier;
            if (currentSize >= maxSize) return minMultiplier;
            const progress = (currentSize - minSize) / (maxSize - minSize);
            const easedProgress = Math.pow(progress, 2);
            return maxMultiplier - (easedProgress * (maxMultiplier - minMultiplier));
        }

        function updateMonkeyScale() {
            const MIN_SCREEN_WIDTH = 320, MAX_SCREEN_WIDTH = 1920;
            const MIN_SCREEN_HEIGHT = 480, MAX_SCREEN_HEIGHT = 1080;
            const MAX_WIDTH_MULTIPLIER = 0.5, MIN_WIDTH_MULTIPLIER = 0.40;
            const MAX_HEIGHT_MULTIPLIER = 0.80, MIN_HEIGHT_MULTIPLIER = 0.65;

            const widthMultiplier = getDynamicMultiplier(window.innerWidth, MIN_SCREEN_WIDTH, MAX_SCREEN_WIDTH, MAX_WIDTH_MULTIPLIER, MIN_WIDTH_MULTIPLIER);
            const heightMultiplier = getDynamicMultiplier(window.innerHeight, MIN_SCREEN_HEIGHT, MAX_SCREEN_HEIGHT, MAX_HEIGHT_MULTIPLIER, MIN_HEIGHT_MULTIPLIER);

            const targetWidth = window.innerWidth * widthMultiplier;
            const targetHeight = window.innerHeight * heightMultiplier;

            let scaleBasedOnHeight = targetHeight / 900;
            let scaleBasedOnWidth = targetWidth / 600;

            baseScale = Math.min(scaleBasedOnHeight, scaleBasedOnWidth);
            characterContainer.style.transform = `translate(-50%, -50%) scale(${baseScale})`;
        }

        characterContainer.addEventListener('mouseenter', () => {
            const hoverScale = baseScale * 1.03;
            characterContainer.style.transform = `translate(-50%, -50%) scale(${hoverScale})`;
        });

        characterContainer.addEventListener('mouseleave', () => {
            characterContainer.style.transform = `translate(-50%, -50%) scale(${baseScale})`;
        });

        window.addEventListener('resize', updateMonkeyScale);

        // --- Character Part Changers ---
        const resolveImage = (value) => (typeof window !== 'undefined' && window.resolveImagePath)
            ? window.resolveImagePath(value)
            : value;
        const resolveImageList = (values) => Array.isArray(values)
            ? values.map(resolveImage)
            : values;
        const resolveImagePairList = (pairs) => Array.isArray(pairs)
            ? pairs.map(pair => ({ left: resolveImage(pair.left), right: resolveImage(pair.right) }))
            : pairs;

        const frontSection = document.querySelector('.front');
        if (frontSection) {
          frontSection.style.backgroundImage = `url('${resolveImage('images/frontpagewinter.png')}')`;
        }

        const headImage = document.getElementById('head');
        const prevHeadButton = document.getElementById('prev-head');
        const nextHeadButton = document.getElementById('next-head');
        const headImages = resolveImageList(['images/Anime/BuildingTemplate/01-Head/Heads/Head1-min.png', 'images/Anime/BuildingTemplate/01-Head/Heads/Head2-min.png', 'images/Anime/BuildingTemplate/01-Head/Heads/Head3-min.png', 'images/Anime/BuildingTemplate/01-Head/Heads/Head4-min.png', 'images/Anime/BuildingTemplate/01-Head/Heads/Head5-min.png', 'images/Anime/BuildingTemplate/01-Head/Heads/Head6-min.png','images/Anime/BuildingTemplate/01-Head/Heads/Head7-min.png','images/Anime/BuildingTemplate/01-Head/Heads/Head8-min.png']);
        let currentHeadIndex = 0;
        function updateHead() { headImage.src = headImages[currentHeadIndex]; }

        const leftEarImage = document.getElementById('left-ear');
        const rightEarImage = document.getElementById('right-ear');
        const prevEarsButton = document.getElementById('prev-ears');
        const nextEarsButton = document.getElementById('next-ears');
        const earImages = resolveImagePairList([{ left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar1-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar1-min.png' }, { left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar2-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar2-min.png' }, { left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar3-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar3-min.png' }, { left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar4-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar4-min.png' }, { left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar5-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar5-min.png' }, { left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar6-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar6-min.png' }, { left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar7-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar7-min.png' }, { left: 'images/Anime/BuildingTemplate/04-Ears/Ears/LeftEar8-min.png', right: 'images/Anime/BuildingTemplate/04-Ears/Ears/RightEar8-min.png' }]);
        let currentEarIndex = 0;
        function updateEars() { const earPair = earImages[currentEarIndex]; leftEarImage.src = earPair.left; rightEarImage.src = earPair.right; }

        const bodyImage = document.getElementById('body');
        const prevBodyButton = document.getElementById('prev-body');
        const nextBodyButton = document.getElementById('next-body');
        const bodyImages = resolveImageList(['images/Anime/BuildingTemplate/05-Body/Bodies/Body1-min.png', 'images/Anime/BuildingTemplate/05-Body/Bodies/Body2-min.png', 'images/Anime/BuildingTemplate/05-Body/Bodies/Body3-min.png', 'images/Anime/BuildingTemplate/05-Body/Bodies/Body4-min.png', 'images/Anime/BuildingTemplate/05-Body/Bodies/Body5-min.png', 'images/Anime/BuildingTemplate/05-Body/Bodies/Body6-min.png','images/Anime/BuildingTemplate/05-Body/Bodies/Body7-min.png']);
        let currentBodyIndex = 0;
        function updateBody() { bodyImage.src = bodyImages[currentBodyIndex]; }

        const leftArmImage = document.getElementById('left-arm');
        const rightArmImage = document.getElementById('right-arm');
        const prevArmsButton = document.getElementById('prev-arms');
        const nextArmsButton = document.getElementById('next-arms');
        const armImages = resolveImagePairList([{ left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm1-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm1-min.png' }, { left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm2-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm2-min.png' }, { left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm3-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm3-min.png' }, { left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm4-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm4-min.png' }, { left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm5-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm5-min.png' }, { left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm6-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm6-min.png' }, { left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm7-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm7-min.png' }, { left: 'images/Anime/BuildingTemplate/06-Arms/Arms/LeftArm8-min.png', right: 'images/Anime/BuildingTemplate/06-Arms/Arms/RightArm8-min.png' }]);
        let currentArmIndex = 0;
        function updateArms() { const armPair = armImages[currentArmIndex]; leftArmImage.src = armPair.left; rightArmImage.src = armPair.right; }

        const legsImage = document.getElementById('legs');
        const prevLegsButton = document.getElementById('prev-legs');
        const nextLegsButton = document.getElementById('next-legs');
        const legImages = resolveImageList(['images/Anime/BuildingTemplate/07-Legs/Legs/Legs1-min.png', 'images/Anime/BuildingTemplate/07-Legs/Legs/Legs2-min.png', 'images/Anime/BuildingTemplate/07-Legs/Legs/Legs3-min.png', 'images/Anime/BuildingTemplate/07-Legs/Legs/Legs4-min.png', 'images/Anime/BuildingTemplate/07-Legs/Legs/Legs5-min.png', 'images/Anime/BuildingTemplate/07-Legs/Legs/Legs6-min.png','images/Anime/BuildingTemplate/07-Legs/Legs/Legs7-min.png','images/Anime/BuildingTemplate/07-Legs/Legs/Legs8-min.png']);
        let currentLegIndex = 0;
        function updateLegs() { legsImage.src = legImages[currentLegIndex]; }

        const tailImage = document.getElementById('tail');
        const prevTailButton = document.getElementById('prev-tail');
        const nextTailButton = document.getElementById('next-tail');
        const tailImages = resolveImageList(['images/Anime/BuildingTemplate/08-Tail/Tails/Tail1-min.png', 'images/Anime/BuildingTemplate/08-Tail/Tails/Tail2-min.png', 'images/Anime/BuildingTemplate/08-Tail/Tails/Tail3-min.png', 'images/Anime/BuildingTemplate/08-Tail/Tails/Tail4-min.png', 'images/Anime/BuildingTemplate/08-Tail/Tails/Tail5-min.png', 'images/Anime/BuildingTemplate/08-Tail/Tails/Tail6-min.png', 'images/Anime/BuildingTemplate/08-Tail/Tails/Tail7-min.png','images/Anime/BuildingTemplate/08-Tail/Tails/Tail8-min.png']);
        let currentTailIndex = 0;
        function updateTail() { tailImage.src = tailImages[currentTailIndex]; }

        // --- Event Listeners for Monkey Builder ---
        nextHeadButton.addEventListener('click', (event) => { event.stopPropagation(); currentHeadIndex = (currentHeadIndex + 1) % headImages.length; updateHead(); });
        prevHeadButton.addEventListener('click', (event) => { event.stopPropagation(); currentHeadIndex = (currentHeadIndex - 1 + headImages.length) % headImages.length; updateHead(); });
        nextEarsButton.addEventListener('click', (event) => { event.stopPropagation(); currentEarIndex = (currentEarIndex + 1) % earImages.length; updateEars(); });
        prevEarsButton.addEventListener('click', (event) => { event.stopPropagation(); currentEarIndex = (currentEarIndex - 1 + earImages.length) % earImages.length; updateEars(); });
        nextBodyButton.addEventListener('click', (event) => { event.stopPropagation(); currentBodyIndex = (currentBodyIndex + 1) % bodyImages.length; updateBody(); });
        prevBodyButton.addEventListener('click', (event) => { event.stopPropagation(); currentBodyIndex = (currentBodyIndex - 1 + bodyImages.length) % bodyImages.length; updateBody(); });
        nextArmsButton.addEventListener('click', (event) => { event.stopPropagation(); currentArmIndex = (currentArmIndex + 1) % armImages.length; updateArms(); });
        prevArmsButton.addEventListener('click', (event) => { event.stopPropagation(); currentArmIndex = (currentArmIndex - 1 + armImages.length) % armImages.length; updateArms(); });
        nextLegsButton.addEventListener('click', (event) => { event.stopPropagation(); currentLegIndex = (currentLegIndex + 1) % legImages.length; updateLegs(); });
        prevLegsButton.addEventListener('click', (event) => { event.stopPropagation(); currentLegIndex = (currentLegIndex - 1 + legImages.length) % legImages.length; updateLegs(); });
        nextTailButton.addEventListener('click', (event) => { event.stopPropagation(); currentTailIndex = (currentTailIndex + 1) % tailImages.length; updateTail(); });
        prevTailButton.addEventListener('click', (event) => { event.stopPropagation(); currentTailIndex = (currentTailIndex - 1 + tailImages.length) % tailImages.length; updateTail(); });
        
        // --- Order Button Logic ---
        const orderButton = document.getElementById('orderButton');
        orderButton.addEventListener('click', (e) => {
            const partsToSave = ['head', 'left-ear', 'right-ear', 'body', 'left-arm', 'right-arm', 'legs', 'tail'];
            const params = new URLSearchParams();
            partsToSave.forEach(partId => {
                const imageElement = document.getElementById(partId);
                if (imageElement) {
                    params.append(partId, encodeURIComponent(imageElement.src));
                }
            });
            window.location.href = `customizationproduct.html?${params.toString()}`;
        });

        // --- Initial Setup Calls ---
        updateMonkeyScale();
        updateHead();
        updateEars();
        updateBody();
        updateArms();
        updateLegs();
        updateTail();
    });
  </script>
</body>
</html>
